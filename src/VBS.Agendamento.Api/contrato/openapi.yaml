          description: Status alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profissional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /profissionais/{profissionalId}/horarios:
    parameters:
    - $ref: '#/components/parameters/profissionalId'
    get:
      tags:
      - Profissionais
      operationId: obterHorariosProfissional
      summary: Consultar expediente e intervalos
      x-permissao: profissional.cadastro:visualizar
      responses:
        '200':
          description: Horários.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Horario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
