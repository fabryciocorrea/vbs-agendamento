      - totais
      properties:
        data:
          type: string
          format: date
        dataInicial:
          type: string
          format: date
        dataFinal:
          type: string
          format: date
        unidade:
          allOf:
          - $ref: '#/components/schemas/Referencia'
          nullable: true
        profissional:
          allOf:
          - $ref: '#/components/schemas/Referencia'
          nullable: true
        atualizadoEm:
          type: string
          format: date-time
        totais:
          type: object
          required:
          - agendadas
          - confirmadas
          - canceladas
          properties:
            agendadas:
              type: integer
            confirmadas:
              type: integer
            checkIn:
              type: integer
            emAtendimento:
              type: integer
            concluidas:
              type: integer
            canceladas:
              type: integer
            faltas:
              type: integer
            remarcadas:
              type: integer
            encaixes:
              type: integer
              description: Encaixes do dia, já contados nos demais status.
            total:
              type: integer
        distribuicao:
          type: array
          description: Atendimentos do dia (sem canceladas, remarcadas e faltas) por convênio e particular, do maior para o menor.
          items:
            type: object
            properties:
              tipo:
                type: string
                enum:
                - PARTICULAR
                - CONVENIO
              nome:
                type: string
              quantidade:
                type: integer
        pendencias:
          type: object
          description: Pontos de atenção do dia. As guias só vêm para quem tem acesso ao faturamento.
          properties:
            emAtraso:
              type: integer
              description: Agendadas ou confirmadas cujo horário já passou sem check-in.
            pagamentoParticularPendente:
              type: integer
            guiasPendentes:
              type: integer
              nullable: true
              description: Consultas de convênio, do dia em diante, com a guia pendente.
            guiasParaCancelar:
              type: integer
              nullable: true
              description: Consultas canceladas cuja guia continua autorizada (o faturamento precisa cancelá-la).
        proximas:
          type: array
          description: Até 12 consultas do dia ainda em andamento, por horário.
          items:
            type: object
            properties:
              consultaId:
                type: string
                format: uuid
              inicio:
                type: string
                format: date-time
              status:
                type: string
              paciente:
                type: string
              profissional:
                type: string
              especialidade:
                type: string
              unidade:
                type: string
              tipoAtendimento:
                type: string
              convenio:
                type: string
                nullable: true
              encaixe:
                type: boolean
              alertas:
                type: array
                items:
                  type: string
        listaEspera:
          type: object
          nullable: true
          description: Nulo para quem não tem acesso à lista de espera.
          properties:
            aguardando:
              type: integer
            horarioLiberado:
              type: integer
