        A recepção marca o item como ATENDIDO (o paciente foi encaixado) ou CANCELADO. NOTIFICADO é definido pelo servidor quando um horário é liberado (G9). Um item NOTIFICADO pode voltar para AGUARDANDO (volta à fila e passa a receber novos avisos). Item já encerrado retorna 409 (LISTA_ESPERA_ENCERRADA).
