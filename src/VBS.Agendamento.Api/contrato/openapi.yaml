      - Consultas
      operationId: exportarFaturamento
      summary: Exportar o faturamento em CSV
      x-permissao: faturamento.financeiro:exportar
      description: |
        Uma linha por consulta concluída no período (data, hora, paciente, profissional, especialidade, unidade, tipo, convênio, valor, forma de pagamento, pagamento confirmado, guia e número da guia). CSV com separador ponto e vírgula e UTF-8 com BOM, para abrir no Excel. Grava no log (EXPORTAR).
      parameters:
