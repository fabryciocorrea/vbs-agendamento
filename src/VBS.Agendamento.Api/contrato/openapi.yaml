      operationId: listarNotificacoesConsulta
      summary: Mensagens enviadas ao paciente sobre a consulta
      x-permissao: consulta.agendamento:visualizar
      description: |
        Mostra à recepção o que foi enviado (confirmação, lembrete, aviso de cancelamento ou remarcação), por qual canal, se foi entregue e o que o paciente respondeu. O perfil Médico só abre as próprias consultas (404 nas demais).
      responses:
        '200':
          description: Mensagens, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificacaoPaciente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /consultas/{consultaId}/notificacoes/reenvio:
    parameters:
    - $ref: '#/components/parameters/ConsultaId'
    post:
      tags:
      - Mensagens ao paciente
      operationId: reenviarNotificacaoConsulta
      summary: Reenviar confirmação ou lembrete
      x-permissao: consulta.agendamento:editar
      description: |
        A recepção reenvia a confirmação ou o lembrete, por exemplo quando o paciente diz que não recebeu.
        - Só em consulta AGENDADA ou CONFIRMADA e futura (409 `CONSULTA_SEM_ENVIO`).
        - Paciente sem consentimento de contato por SMS e WhatsApp não recebe (409 `SEM_CONSENTIMENTO_CONTATO`, RN27): a recepção contata por telefone.
        - Segundo reenvio do mesmo tipo em menos de 10 minutos: 409 `ENVIO_RECENTE`.
        - O reenvio é gravado no log com o usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenvioEntrada'
      responses:
        '202':
          description: Reenvio aceito; a entrega segue pelos eventos do provedor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacaoPaciente'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /parametros-notificacao:
    get:
      tags:
      - Parâmetros das notificações
      operationId: obterParametrosNotificacao
      summary: Consultar as antecedências das mensagens
      x-permissao: notificacao.parametros:visualizar
      responses:
