        schema:
          type: string
          format: date
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: tipoAtendimento
        in: query
        schema:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
      responses:
        '200':
          description: Relatório.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioOcupacao'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
