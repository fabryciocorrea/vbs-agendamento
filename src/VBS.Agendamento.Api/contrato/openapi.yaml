      - tipoAtendimento
      - quantidade
      - valor
      properties:
        tipoAtendimento:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
        convenio:
          allOf:
          - $ref: '#/components/schemas/Referencia'
          nullable: true
          description: Preenchido nas linhas de convênio, uma por convênio.
        quantidade:
          type: integer
        valor:
          type: number
          format: double
    TotaisFaturamento:
      type: object
      required:
      - quantidade
      - valor
      properties:
        quantidade:
          type: integer
        valor:
          type: number
          format: double
    RelatorioFaturamentoPorTipo:
      type: object
      description: Faturamento por particular e por convênio, das consultas concluídas (RF20). O valor de convênio é informativo.
      required:
      - filtros
      - geradoEm
      - itens
      - totais
      properties:
        filtros:
          $ref: '#/components/schemas/FiltrosAplicados'
        geradoEm:
          type: string
          format: date-time
        itens:
          type: array
          items:
            $ref: '#/components/schemas/FaturamentoPorTipoItem'
        totais:
          $ref: '#/components/schemas/TotaisFaturamento'
    FaturamentoConvenioMes:
      type: object
      required:
      - convenio
      - quantidade
      - valor
      properties:
        convenio:
          $ref: '#/components/schemas/Referencia'
        quantidade:
          type: integer
        valor:
          type: number
          format: double
    FaturamentoMensalItem:
      type: object
      required:
      - mes
      - particular
      - convenio
      - porConvenio
      - valorTotal
      properties:
        mes:
          type: string
          description: AAAA-MM.
        particular:
          $ref: '#/components/schemas/ValorQuantidade'
        convenio:
          $ref: '#/components/schemas/ValorQuantidade'
        porConvenio:
          type: array
          items:
            $ref: '#/components/schemas/FaturamentoConvenioMes'
          description: Valor de cada convênio no mês, no mesmo formato do particular.
        valorTotal:
          type: number
          format: double
    RelatorioFaturamentoMensal:
      type: object
      description: Faturamento mês a mês no período (RF21).
      required:
      - filtros
      - geradoEm
      - itens
      - totais
      properties:
        filtros:
          $ref: '#/components/schemas/FiltrosAplicados'
        geradoEm:
          type: string
          format: date-time
        itens:
          type: array
          items:
            $ref: '#/components/schemas/FaturamentoMensalItem'
        totais:
          $ref: '#/components/schemas/TotaisFaturamento'
    ProfissionalProntuario:
      type: object
