      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profissional'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
    delete:
      tags:
      - Profissionais
      operationId: excluirProfissional
      summary: Excluir profissional
      x-permissao: profissional.cadastro:excluir
      description: |
        Exclusão definitiva, **somente para o administrador**, de o profissional sem histórico (sem consultas, prontuário, lista de espera ou outros vínculos). Vínculos de cadastro (por exemplo, especialidades de um profissional) saem junto. Com histórico responde `409 REGISTRO_COM_VINCULOS`: use inativar. A exclusão fica no log de auditoria (ação EXCLUIR).
      responses:
        '204':
          description: Excluído.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /profissionais/{profissionalId}/status:
    parameters:
    - $ref: '#/components/parameters/profissionalId'
    patch:
      tags:
      - Profissionais
      operationId: alterarStatusProfissional
      summary: Ativar ou inativar profissional
      x-permissao: profissional.cadastro:editar
      description: |
        Inativar substitui a exclusão (RN14). Com consulta futura marcada, retorna 409 com `codigo` `PROFISSIONAL_COM_CONSULTAS` e a quantidade (F4).
        A resposta traz `quantidadePacientes`: pacientes que continuam com este profissional como responsável. A recepção deve trocá-lo pela operação do bloco 2. Profissional inativo não recebe novos agendamentos.
      requestBody:
