      tags:
      - Pacientes
      operationId: obterPaciente
      summary: Consultar um paciente
      description: Campos sem liberação de visualização para o perfil não são enviados (E2). O médico vê somente os campos liberados pela RN24.
      x-permissao: paciente.cadastro:visualizar
