        Exclusão definitiva, **somente para o administrador**, de o paciente sem histórico (sem consultas, prontuário, lista de espera ou outros vínculos). Vínculos de cadastro (por exemplo, especialidades de um profissional) saem junto. Com histórico responde `409 REGISTRO_COM_VINCULOS`: use inativar. A exclusão fica no log de auditoria (ação EXCLUIR).
      responses:
        '204':
          description: Excluído.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /pacientes/{pacienteId}/status:
    parameters:
    - $ref: '#/components/parameters/PacienteId'
    patch:
      tags:
      - Pacientes
      operationId: alterarStatusPaciente
      summary: Ativar ou inativar um paciente
      description: |
        Inativar substitui a exclusão (RN14). Com `ativo` falso, se o paciente tiver consulta futura marcada (agendada, confirmada ou em andamento), o servidor responde **409** com `codigo` `PACIENTE_COM_CONSULTAS` e a quantidade em `quantidadeConsultas` (E7). O paciente inativo não recebe novos agendamentos. Ativar de novo é sempre permitido.
      x-permissao: paciente.cadastro:editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ativo
              properties:
                ativo:
                  type: boolean
      responses:
        '200':
          description: Status alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paciente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
