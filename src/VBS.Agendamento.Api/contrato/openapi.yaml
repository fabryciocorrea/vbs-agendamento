        itens:
          type: array
          items:
            $ref: '#/components/schemas/LogAuditoria'
        pagina:
          type: integer
        tamanho:
          type: integer
        total:
          type: integer
    Problema:
      type: object
      description: Erro no formato RFC 7807 (application/problem+json). O campo `codigo` identifica a regra de negócio, para a tela mostrar a
        mensagem certa.
      required:
      - title
      - status
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          description: Código da regra de negócio que gerou o erro, quando houver.
          enum:
          - RESPONSAVEL_NAO_CADASTRADO
          - PACIENTE_NAO_CADASTRADO
          - CPF_DUPLICADO
          - PACIENTE_COM_CONSULTAS
          - CNPJ_DUPLICADO
          - CONSELHO_DUPLICADO
          - NUMERO_SALA_DUPLICADO
          - UNIDADE_COM_CONSULTAS
          - ESPECIALIDADE_COM_CONSULTAS
          - SALA_COM_CONSULTAS
          - PROFISSIONAL_COM_CONSULTAS
          - CONVENIO_COM_CONSULTAS
          - VINCULO_EM_USO
          - HORARIO_INVALIDO
          - CREDENCIAMENTO_DUPLICADO
          - VIGENCIA_INVALIDA
          - UNIDADE_OU_ESPECIALIDADE_INATIVA
          - HORARIO_INDISPONIVEL
          - AGENDA_EM_USO
          - LIMITE_ENCAIXES_ATINGIDO
          - CONSULTA_ALTERADA
          - STATUS_NAO_PERMITE
          - TRANSICAO_INVALIDA
          - FORA_DO_EXPEDIENTE
          - HORARIO_BLOQUEADO
          - HORARIO_NO_PASSADO
          - CARTEIRINHA_VENCIDA
          - CONVENIO_DIVERGENTE
          - PACIENTE_INATIVO
          - PROFISSIONAL_NAO_ATENDE
          - CANCELAMENTO_FORA_DO_PRAZO
          - FALTA_ANTES_DO_HORARIO
          - PAGAMENTO_JA_CONFIRMADO
          - PAGAMENTO_PENDENTE
          - FERIADO_DUPLICADO
          - CONVENIO_NAO_CREDENCIADO
          - LIBERACAO_CREDENCIAMENTO_NEGADA
          - ACESSO_PRONTUARIO_NEGADO
          - REGISTRO_DUPLICADO
          - CONSULTA_INVALIDA
          - PROFISSIONAL_INVALIDO
          - SEM_ALTERACAO
          - CONSULTA_SEM_ENVIO
          - SEM_CONSENTIMENTO_CONTATO
          - ENVIO_RECENTE
          - ASSINATURA_INVALIDA
          - PARAMETROS_INVALIDOS
          - PERIODO_INVALIDO
          - EXPORTACAO_MUITO_GRANDE
          - VALOR_SEM_LIBERACAO
          - TEXTO_SOMENTE_ADMINISTRADOR
          - FILTRO_INVALIDO
          - MEDICO_SEM_ACESSO
        erros:
          type: array
          description: Erros por campo, quando houver.
          items:
            type: object
            required:
            - campo
            - mensagem
            properties:
              campo:
                type: string
              mensagem:
                type: string
        quantidadeUsuarios:
          type: integer
          description: Somente ao tentar excluir um perfil com usuários vinculados.
