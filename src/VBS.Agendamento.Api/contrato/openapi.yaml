                $ref: '#/components/schemas/ParametrosNotificacao'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /webhooks/provedor/status-entrega:
    post:
      tags:
      - Webhooks do provedor
      operationId: receberStatusEntrega
      summary: Receber o status de entrega de uma mensagem
      x-permissao: pública
      description: |
        Chamado pelo provedor de SMS e WhatsApp (ou pelo adaptador dele) quando uma mensagem muda de situação. **Não usa token de usuário**: a requisição traz a assinatura no cabeçalho `X-Assinatura` (HMAC SHA-256 do corpo com o segredo combinado) e o instante no cabeçalho `X-Instante`; assinatura inválida ou instante com mais de 5 minutos de diferença: 401 `ASSINATURA_INVALIDA`.
        - Atualiza o status de entrega da mensagem (ENVIADA, ENTREGUE, LIDA ou FALHA) e a data.
        - Falha no WhatsApp: o servidor tenta o SMS. Falha nos dois canais: aviso `FALHA_ENVIO` à recepção.
        - Evento repetido (mesmo `eventoId`) ou de mensagem desconhecida responde 200, sem efeito, para o provedor não reenviar.
        - Este endereço é o contrato do sistema; a escolha do provedor (P18) só exige um adaptador que traduza o formato dele.
      security:
      - assinaturaWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoStatusEntrega'
      responses:
        '200':
          description: Evento recebido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/AssinaturaInvalida'
  /webhooks/provedor/resposta:
    post:
      tags:
      - Webhooks do provedor
      operationId: receberRespostaPaciente
      summary: Receber a resposta do paciente
      x-permissao: pública
      description: |
        Mesma segurança do endereço de status. Interpretação da resposta (K3):
        - **Confirma** ("sim", "1", "confirmo", sem diferença de maiúsculas e acentos): a consulta passa de AGENDADA para CONFIRMADA, com o histórico de status. Consulta já confirmada ou em outro status: só registra a resposta.
        - **Não confirma** ("não", "2", "não vou"): nada muda sozinho, porque o cancelamento pelo paciente só vale com a antecedência mínima e é feito pela recepção (RN06). O servidor avisa a recepção (`RESPOSTA_PACIENTE`).
        - **Qualquer outro texto:** a recepção é avisada com o texto recebido.
        - A resposta é ligada à mensagem informada ou, sem ela, à última mensagem pendente do telefone. Sem correspondência: 200 com `IGNORADO_SEM_CORRESPONDENCIA`.
      security:
      - assinaturaWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoResposta'
      responses:
        '200':
          description: Evento recebido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/AssinaturaInvalida'
  /dashboards/painel-do-dia:
    get:
      tags:
      - Dashboards
      operationId: obterPainelDoDia
      summary: Painel do dia
      x-permissao: dashboard.painel:visualizar
      description: |
        Nunca disponível ao usuário vinculado a profissional (médico), mesmo que o perfil tenha a liberação: 403 `MEDICO_SEM_ACESSO` (RN20, L10). Conta as consultas do dia por status, incluindo os encaixes. `data` vazia: hoje, no horário de Brasília. A tela atualiza consultando a cada 30 segundos (L1).
      parameters:
      - name: data
        in: query
        description: Um só dia. Vale quando dataInicial não é informada.
        schema:
          type: string
          format: date
      - name: dataInicial
        in: query
        description: Início do período (horário de Brasília).
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        description: Fim do período, inclusive. No máximo 366 dias depois de dataInicial. Vazia, só o dia inicial.
        schema:
          type: string
          format: date
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: tipo
        in: query
        description: Filtra por tipo de atendimento. Vazio, todos.
        schema:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
      responses:
        '200':
          description: Contagens do dia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PainelDoDia'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /dashboards/financeiro-mensal:
    get:
      tags:
      - Dashboards
      operationId: obterFinanceiroMensal
      summary: Financeiro do mês
      x-permissao: dashboard.financeiro:visualizar
      description: |
        Nunca disponível ao usuário vinculado a profissional (médico), mesmo que o perfil tenha a liberação: 403 `MEDICO_SEM_ACESSO` (RN20, L10). Soma os valores das consultas CONCLUIDAS no mês, pela data da consulta, separando particular e convênio, com comparação com o mês anterior (L2). Exige também a liberação de visualização do campo de valor (RN20); sem ela, 403 `VALOR_SEM_LIBERACAO`. `mes` vazio: o mês atual.
      parameters:
      - name: mes
        in: query
        description: AAAA-MM.
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      - name: unidadeId
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Soma do mês.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceiroMensal'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
