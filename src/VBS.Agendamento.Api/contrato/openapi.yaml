      operationId: obterValorConsultaConvenio
      summary: Valor da consulta por convênio
      x-permissao: consulta.agendamento:visualizar
      description: |
        Devolve o valor cadastrado no credenciamento do convênio para a unidade e a especialidade (usado pela tela de agendamento, somente leitura). `valor` vem vazio quando não há credenciamento cadastrado. `credenciado` indica se há credenciamento aprovado e vigente na data.
      parameters:
      - name: unidadeId
        in: query
        required: true
        schema:
          type: integer
      - name: especialidadeId
        in: query
        required: true
        schema:
          type: integer
      - name: data
        in: query
        description: Data da consulta. Padrão, hoje.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Valor do convênio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valor:
                    type: number
                    format: decimal
                    nullable: true
                  credenciado:
                    type: boolean
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /convenios/{convenioId}/credenciamentos/lote:
    parameters:
    - $ref: '#/components/parameters/ConvenioId'
    post:
      tags:
      - Credenciamento
      operationId: incluirCredenciamentosLote
      summary: Incluir credenciamentos de várias especialidades
      x-permissao: convenio.credenciamento:incluir
      description: |
        Facilita o cadastro inicial: o mesmo convênio, na mesma unidade, para várias especialidades de uma vez, com a mesma situação e vigência. É tudo ou nada: se alguma combinação já existe, 409 `CREDENCIAMENTO_DUPLICADO` e nada é gravado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredenciamentoLoteEntrada'
      responses:
        '201':
          description: Credenciamentos incluídos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credenciamento'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /convenios/{convenioId}/credenciamentos/{credenciamentoId}:
    parameters:
    - $ref: '#/components/parameters/ConvenioId'
    - $ref: '#/components/parameters/CredenciamentoId'
    put:
      tags:
      - Credenciamento
      operationId: atualizarCredenciamento
      summary: Alterar credenciamento
      x-permissao: convenio.credenciamento:editar
      description: |
        Altera situação, vigência, protocolo e observação e, com a mesma permissão, também o convênio, a unidade e a especialidade (o administrador sempre pode). A nova combinação é conferida (unidade e especialidade ativas, especialidade do convênio, sem duplicidade) e as datas são validadas (fim não anterior ao início; faixa de 2000 até 30 anos à frente). Vale para **novos agendamentos** e remarcações. As consultas já marcadas **não são canceladas nem alteradas** (J4): se o credenciamento deixa de valer (situação diferente de APROVADO ou fim de vigência), o servidor avisa a recepção por notificação interna e as consultas futuras afetadas aparecem em `GET /consultas/sem-credenciamento`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredenciamentoAtualizacao'
      responses:
        '200':
          description: Credenciamento atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credenciamento'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags:
      - Credenciamento
      operationId: excluirCredenciamento
      summary: Excluir credenciamento
      x-permissao: convenio.credenciamento:excluir
      description: |
        Exclusão definitiva, **somente para o administrador**, de o credenciamento sem histórico (sem consultas, prontuário, lista de espera ou outros vínculos). Vínculos de cadastro (por exemplo, especialidades de um profissional) saem junto. Com histórico responde `409 REGISTRO_COM_VINCULOS`: use inativar. A exclusão fica no log de auditoria (ação EXCLUIR).
      responses:
        '204':
          description: Excluído.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
