        faltas:
          type: integer
    RelatorioCancelamentosFaltas:
      type: object
      description: Cancelamentos e não comparecimentos (RF19).
      required:
      - filtros
      - geradoEm
      - itens
      - totais
      properties:
        filtros:
          $ref: '#/components/schemas/FiltrosAplicados'
        geradoEm:
          type: string
          format: date-time
        itens:
          type: array
          items:
            $ref: '#/components/schemas/CancelamentoFaltaResumo'
        totais:
          $ref: '#/components/schemas/TotaisCancelamentosFaltas'
        detalhe:
          allOf:
          - $ref: '#/components/schemas/CancelamentoFaltaDetalhePagina'
          nullable: true
          description: Só quando `visao` é DETALHE.
    FaturamentoPorTipoItem:
      type: object
