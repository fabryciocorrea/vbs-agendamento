      x-permissao: faturamento.financeiro:visualizar
      description: |
        Consultas por convênio (sem as remarcadas; as canceladas aparecem com a guia CANCELADA) com a situação da guia: PENDENTE (padrão, enquanto o faturamento não confirmar), AUTORIZADA, NEGADA ou CANCELADA (guia de consulta cancelada é cancelada automaticamente). Filtros: situação da guia, convênio, período (datas de Brasília) e busca por paciente, carteirinha ou número da guia.
      parameters:
