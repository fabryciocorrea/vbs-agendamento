          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Relatório.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioCancelamentosFaltas'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /relatorios/faturamento-por-tipo:
    get:
      tags:
      - Relatórios
      operationId: relatorioFaturamentoPorTipo
      summary: Faturamento por particular e convênio
      x-permissao: relatorio.faturamento_tipo:visualizar
      description: |
        Nunca disponível ao usuário vinculado a profissional (médico), mesmo que o perfil tenha a liberação: 403 `MEDICO_SEM_ACESSO` (RN20, L10). Filtros do RF22 (período, profissional, unidade, convênio e tipo). Período de no máximo 366 dias; fora disso, 400 `PERIODO_INVALIDO`. Datas e horas no horário de Brasília. Cada geração é gravada no log. Soma das consultas CONCLUIDAS, uma linha para o particular e **uma linha para cada convênio**, cada uma com a quantidade e o valor, do mesmo jeito que o particular (L6). A tela de faturamento mostra só valores e quantidades. O valor de convênio é informativo, sem guias TISS e TUSS nem glosas. Exige a liberação de visualização do valor (`VALOR_SEM_LIBERACAO`).
      parameters:
      - name: dataInicial
        in: query
        required: true
        description: Início do período, no horário de Brasília.
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        description: Fim do período, inclusive. No máximo 366 dias depois do início.
        schema:
          type: string
          format: date
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: tipoAtendimento
        in: query
        schema:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
      responses:
        '200':
          description: Relatório.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioFaturamentoPorTipo'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /relatorios/faturamento-mensal:
    get:
      tags:
      - Relatórios
      operationId: relatorioFaturamentoMensal
      summary: Faturamento mensal
      x-permissao: relatorio.faturamento_mensal:visualizar
      description: |
        Nunca disponível ao usuário vinculado a profissional (médico), mesmo que o perfil tenha a liberação: 403 `MEDICO_SEM_ACESSO` (RN20, L10). Filtros do RF22 (período, profissional, unidade, convênio e tipo). Período de no máximo 366 dias; fora disso, 400 `PERIODO_INVALIDO`. Datas e horas no horário de Brasília. Cada geração é gravada no log. Uma linha por mês do período, com o particular, o total de convênios e o valor de cada convênio no mês (`porConvenio`). Mostra só valores e quantidades. Exige a liberação de visualização do valor (`VALOR_SEM_LIBERACAO`).
      parameters:
      - name: dataInicial
        in: query
        required: true
        description: Início do período, no horário de Brasília.
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        description: Fim do período, inclusive. No máximo 366 dias depois do início.
        schema:
          type: string
          format: date
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: tipoAtendimento
        in: query
        schema:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
      responses:
        '200':
          description: Relatório.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioFaturamentoMensal'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /relatorios/prontuarios:
    get:
      tags:
      - Relatórios
      operationId: relatorioProntuarios
      summary: Relatório de prontuários
      x-permissao: relatorio.prontuarios:visualizar
      description: |
        Nunca disponível ao usuário vinculado a profissional (médico), mesmo que o perfil tenha a liberação: 403 `MEDICO_SEM_ACESSO` (RN20, L10). Filtros do RF22 (período, profissional, unidade, convênio e tipo). Período de no máximo 366 dias; fora disso, 400 `PERIODO_INVALIDO`. Datas e horas no horário de Brasília. Cada geração é gravada no log. Lista os registros do prontuário por paciente e profissional que os preencheu, **sem o texto clínico** (L7). Só o administrador pode pedir o texto com `incluirTexto` (403 `TEXTO_SOMENTE_ADMINISTRADOR` para os demais). A resposta não fica em cache e a geração grava no log o usuário, o período e a quantidade de registros (RNF05).
      parameters:
      - name: dataInicial
        in: query
        required: true
        description: Início do período, no horário de Brasília.
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        description: Fim do período, inclusive. No máximo 366 dias depois do início.
        schema:
          type: string
          format: date
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: tipoAtendimento
        in: query
        schema:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
      - name: incluirTexto
        in: query
        schema:
          type: boolean
          default: false
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tamanho
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Relatório.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioProntuarios'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /relatorios/{relatorio}/exportacao:
    parameters:
    - name: relatorio
      in: path
      required: true
      schema:
        type: string
        enum:
        - consultas-por-profissional
        - ocupacao-agenda
        - cancelamentos-faltas
        - faturamento-por-tipo
        - faturamento-mensal
        - prontuarios
    get:
      tags:
      - Exportação
      operationId: exportarRelatorio
      summary: Exportar um relatório em PDF, Excel ou CSV
      x-permissao: relatorio.exportacao:exportar
      description: |
        Gera o mesmo relatório da tela, com os mesmos filtros, em arquivo (RF23). Exige duas liberações: a exportação (`relatorio.exportacao:exportar`) e a visualização do relatório escolhido; a recepção, por exemplo, pode ver um relatório sem poder exportá-lo.
        - `formato`: `pdf` (cabeçalho com a clínica, filtros, usuário e data e hora), `xlsx` ou `csv` (UTF-8 com marca de ordem, separador ponto e vírgula, para abrir direto no Excel brasileiro).
        - No máximo 10.000 linhas por arquivo; acima disso, 413 `EXPORTACAO_MUITO_GRANDE`, e o usuário reduz o período ou filtra (L8).
        - Exportar o relatório de prontuários segue a regra do texto: sem o texto clínico, salvo para o administrador com `incluirTexto`.
        - Toda exportação grava no log (ação EXPORTAR) o usuário, o relatório, os filtros e a quantidade de linhas.
        - Não fica em cache.
      parameters:
      - name: formato
        in: query
        required: true
        schema:
          type: string
          enum:
          - pdf
          - xlsx
          - csv
      - name: dataInicial
        in: query
        required: true
        description: Início do período, no horário de Brasília.
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        description: Fim do período, inclusive. No máximo 366 dias depois do início.
        schema:
          type: string
          format: date
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: tipoAtendimento
        in: query
        schema:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
      - name: visao
        in: query
        description: Só no relatório de cancelamentos e faltas.
        schema:
          type: string
          enum:
          - RESUMO
          - DETALHE
      - name: incluirTexto
        in: query
        description: Só no relatório de prontuários, e só para o administrador.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Arquivo gerado.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Nome do arquivo, com o relatório e o período.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '413':
          $ref: '#/components/responses/MuitoGrande'
  /auditoria/acessos:
    get:
      tags:
      - Auditoria
      operationId: listarLogAuditoria
      summary: Consultar o log de auditoria
      x-permissao: auditoria.log:visualizar
      description: |
        Mostra quem visualizou, incluiu, alterou, exportou ou acessou o quê, e quando (RNF05). Filtre por período (no máximo 366 dias), usuário, paciente, ação e entidade. Com `pacienteId`, a tela mostra quem acessou os dados de um paciente, inclusive o prontuário (quantidade de registros, inclusão e edição pelo administrador, com a autorização).
        O log é somente de inclusão: não há edição nem exclusão. Consultar o log também grava um evento VISUALIZAR (L9). Nunca disponível ao usuário vinculado a profissional (médico): 403 `MEDICO_SEM_ACESSO`.
      parameters:
      - name: dataInicial
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: usuarioId
        in: query
        schema:
          type: integer
      - name: pacienteId
        in: query
        description: Mostra quem acessou os dados desse paciente.
        schema:
          type: string
          format: uuid
      - name: acao
        in: query
        schema:
          type: string
          enum:
          - VISUALIZAR
          - INCLUIR
          - EDITAR
          - EXCLUIR
          - EXPORTAR
          - LOGIN
          - LOGIN_FALHA
          - CORRECAO_PRONTUARIO
      - name: entidade
        in: query
        schema:
          type: string
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tamanho
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Página, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogAuditoriaPagina'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /auditoria/acessos/exportacao:
    get:
      tags:
      - Auditoria
      operationId: exportarLogAuditoria
      summary: Exportar o log de auditoria
      x-permissao: auditoria.log:exportar
      description: |
        Mesmos filtros da consulta, em PDF, XLSX ou CSV, até 10.000 linhas (413 `EXPORTACAO_MUITO_GRANDE`). A exportação grava no log a ação EXPORTAR com os filtros e a quantidade de linhas.
      parameters:
      - name: dataInicial
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: usuarioId
        in: query
        schema:
          type: integer
      - name: pacienteId
        in: query
        description: Mostra quem acessou os dados desse paciente.
        schema:
          type: string
          format: uuid
      - name: acao
        in: query
        schema:
          type: string
          enum:
          - VISUALIZAR
          - INCLUIR
          - EDITAR
          - EXCLUIR
          - EXPORTAR
          - LOGIN
          - LOGIN_FALHA
          - CORRECAO_PRONTUARIO
      - name: entidade
        in: query
        schema:
          type: string
      - name: formato
        in: query
        required: true
        schema:
          type: string
          enum:
          - pdf
          - xlsx
          - csv
      responses:
        '200':
          description: Arquivo gerado.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '413':
          $ref: '#/components/responses/MuitoGrande'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    assinaturaWebhook:
      type: apiKey
      in: header
      name: X-Assinatura
      description: HMAC SHA-256 (hexadecimal) do corpo, com o segredo do webhook. Vem junto do cabeçalho `X-Instante`.
  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: integer
    PerfilId:
      name: perfilId
      in: path
      required: true
      schema:
        type: integer
    Pagina:
      name: pagina
      in: query
      description: Número da página, a partir de 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamanho:
      name: tamanho
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PacienteId:
      name: pacienteId
      in: path
      required: true
      description: Identificador público do paciente (GUID).
      schema:
        type: string
        format: uuid
    ResponsavelId:
      name: responsavelId
      in: path
      required: true
      schema:
        type: integer
    unidadeId:
      name: unidadeId
      in: path
      required: true
      description: Código da unidade.
      schema:
        type: integer
    salaId:
      name: salaId
      in: path
      required: true
      description: Código da sala.
      schema:
        type: integer
    convenioId:
      name: convenioId
      in: path
      required: true
      description: Código do convênio.
      schema:
        type: integer
    formaPagamentoId:
      name: formaPagamentoId
      in: path
      required: true
      description: Código da forma de pagamento.
      schema:
        type: integer
    colaboradorId:
      name: colaboradorId
      in: path
      required: true
      description: Código do colaborador ou prestador.
      schema:
        type: integer
    especialidadeId:
      name: especialidadeId
      in: path
      required: true
      description: Código da especialidade.
      schema:
        type: integer
    profissionalId:
      name: profissionalId
      in: path
      required: true
      description: Código do profissional.
      schema:
        type: integer
    ConvenioId:
      name: convenioId
      in: path
      required: true
      description: Código do convênio.
      schema:
        type: integer
    CredenciamentoId:
      name: credenciamentoId
      in: path
      required: true
      schema:
        type: integer
    ConsultaId:
      name: consultaId
      in: path
      required: true
      description: Identificador público da consulta (GUID).
      schema:
        type: string
        format: uuid
    ListaId:
      name: listaId
      in: path
      required: true
      schema:
        type: integer
    ProfissionalId:
      name: profissionalId
      in: path
      required: true
      schema:
        type: integer
    RegistroId:
      name: registroId
      in: path
      required: true
      description: Identificador público do registro (GUID).
      schema:
        type: string
        format: uuid
    NotificacaoId:
      name: notificacaoId
      in: path
      required: true
      schema:
        type: integer
  responses:
    ValidacaoErro:
      description: Dados inválidos, regra de negócio não atendida ou campo obrigatório não preenchido (o campo `codigo` indica a regra; `erros`
        lista os campos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            title: Dados inválidos
            status: 400
            erros:
            - campo: nome
              mensagem: Campo Não Preenchido
    NaoAutenticado:
      description: Não autenticado, credenciais inválidas ou sessão expirada por inatividade (30 minutos sem uso).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    SemPermissao:
      description: O perfil não tem liberação para a ação, tentou alterar campo sem liberação de edição, o recurso é protegido, ou a regra do
        servidor recusa o acesso (por exemplo, médico em valores, relatórios e log, ou prontuário de paciente que não é dele).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            title: Sem permissão
            status: 403
    NaoEncontrado:
      description: Registro não encontrado, ou recurso de outro profissional para o perfil Médico.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Conflito:
      description: 'Conflito com uma regra de negócio: cadastro repetido, horário ocupado, versão desatualizada, transição de status inválida,
        convênio sem credenciamento, entre outros. O campo `codigo` indica a regra.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            title: Conflito
            status: 409
    MuitasRequisicoes:
      description: Muitas tentativas em pouco tempo. Aguarde e tente novamente.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos para aguardar.
    MuitoGrande:
      description: O arquivo passaria de 10.000 linhas. Reduza o período ou use mais filtros.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    AssinaturaInvalida:
      description: Assinatura do webhook ausente, inválida ou fora do prazo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    Senha:
      type: string
      format: password
      minLength: 10
      maxLength: 128
      pattern: ^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{10,128}$
      description: Mínimo de 10 caracteres, com letras, números e pelo menos um caractere especial (D4).
    LoginEntrada:
      type: object
      required:
      - nomeUsuario
      - senha
      properties:
        nomeUsuario:
          type: string
          maxLength: 60
          description: Primeiro e último nome separados por ponto, em minúsculas e sem acento.
          example: fabrycio.correa
        senha:
          type: string
          format: password
    SessaoSaida:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - usuario
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Tempo de inatividade que encerra a sessão, em segundos (30 minutos). Cada requisição autenticada renova a janela.
          example: 1800
        usuario:
          $ref: '#/components/schemas/UsuarioResumo'
    RecuperarSenhaEntrada:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 150
    RedefinirSenhaEntrada:
      type: object
      required:
      - token
      - novaSenha
      properties:
        token:
          type: string
          description: Token recebido por e-mail.
        novaSenha:
          $ref: '#/components/schemas/Senha'
    UsuarioResumo:
      type: object
      required:
      - id
      - nomeUsuario
      - nomeCompleto
      - perfil
      properties:
        id:
          type: integer
        nomeUsuario:
          type: string
        nomeCompleto:
          type: string
        perfil:
          $ref: '#/components/schemas/PerfilReferencia'
    UsuarioAtualSaida:
      type: object
      required:
      - usuario
      - permissoes
      properties:
        administrador:
          type: boolean
          description: Indica o perfil Administrador (pode liberar regras operacionais com justificativa).
        usuario:
          $ref: '#/components/schemas/UsuarioResumo'
        profissionalId:
          type: integer
          nullable: true
          description: Cadastro de profissional vinculado, quando o usuário é médico.
        permissoes:
          $ref: '#/components/schemas/Permissoes'
    PerfilReferencia:
      type: object
      required:
      - id
      - nome
      properties:
        id:
          type: integer
        nome:
          type: string
    Usuario:
      type: object
      required:
      - id
      - nomeUsuario
      - nomeCompleto
      - email
      - cargo
      - ativo
      - perfil
      - bloqueado
      properties:
        id:
          type: integer
        nomeUsuario:
          type: string
        nomeCompleto:
          type: string
        email:
          type: string
          format: email
        cargo:
          type: string
        ativo:
          type: boolean
        perfil:
          $ref: '#/components/schemas/PerfilReferencia'
        profissionalId:
          type: integer
          nullable: true
        bloqueado:
          type: boolean
          description: Verdadeiro após 5 tentativas inválidas, até o administrador desbloquear (D5).
        bloqueadoEm:
          type: string
          format: date-time
          nullable: true
        ultimoLoginEm:
          type: string
          format: date-time
          nullable: true
        criadoEm:
          type: string
          format: date-time
        criadoPor:
          $ref: '#/components/schemas/UsuarioReferencia'
        atualizadoEm:
          type: string
          format: date-time
        atualizadoPor:
          $ref: '#/components/schemas/UsuarioReferencia'
    UsuarioReferencia:
      type: object
      nullable: true
