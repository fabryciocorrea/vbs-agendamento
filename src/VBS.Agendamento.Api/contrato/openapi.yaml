      - dataFinal
      properties:
        dataInicial:
          type: string
          format: date
        dataFinal:
          type: string
          format: date
        profissional:
          allOf:
          - $ref: '#/components/schemas/Referencia'
          nullable: true
        unidade:
          allOf:
          - $ref: '#/components/schemas/Referencia'
          nullable: true
        convenio:
          allOf:
          - $ref: '#/components/schemas/Referencia'
          nullable: true
        tipoAtendimento:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
          nullable: true
    PainelDoDia:
      type: object
      description: Contagem das consultas do dia por status (RF15).
      required:
      - data
