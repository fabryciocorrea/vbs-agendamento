  /consultas:
    get:
      tags:
      - Consultas
      operationId: listarConsultas
      summary: Listar consultas
      x-permissao: consulta.agendamento:visualizar
      description: |
        O perfil Médico recebe somente as próprias consultas.
      parameters:
      - name: dataInicial
        in: query
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        schema:
          type: string
          format: date
      - name: pacienteId
        in: query
        schema:
          type: string
          format: uuid
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: status
        in: query
        schema:
          type: string
          enum:
          - AGENDADA
          - CONFIRMADA
          - CHECK_IN
          - EM_ATENDIMENTO
          - CONCLUIDA
          - CANCELADA
          - FALTA
          - REMARCADA
      - name: encaixe
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de consultas, da mais próxima para a mais distante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaPagina'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
      - Consultas
      operationId: criarConsulta
      summary: Agendar consulta
      x-permissao: consulta.agendamento:incluir
      description: |
        Regras conferidas no servidor, dentro de uma única transação que reserva a agenda do profissional (RN09):
        - **Paciente** ativo. **Profissional** ativo, que atende a especialidade e a unidade escolhidas (RN11, código `PROFISSIONAL_NAO_ATENDE`).
        - **Horário (RN10):** não pode estar no passado (`HORARIO_NO_PASSADO`), fora do expediente (`FORA_DO_EXPEDIENTE`) nem em intervalo, feriado nacional ou recesso (`HORARIO_BLOQUEADO`). O encaixe dispensa o expediente e os intervalos (G2).
        - **Sem sobreposição (RN09):** outra consulta do profissional no mesmo intervalo retorna 409 `HORARIO_INDISPONIVEL`. Se duas pessoas agendam ao mesmo tempo, uma delas recebe esse erro. Agenda reservada por outra operação por mais de 10 segundos retorna 409 `AGENDA_EM_USO`; a tela pode tentar de novo.
        - **Encaixe (RN03):** exige `consulta.encaixe:incluir`, nunca sobrepõe outra consulta e respeita o limite diário (409 `LIMITE_ENCAIXES_ATINGIDO`).
        - **Tipo e convênio (RN02, RN12, G3):** no tipo CONVENIO o convênio é o do cadastro do paciente e a carteirinha deve estar válida: vencida, o agendamento é recusado (400 `CARTEIRINHA_VENCIDA`) com a mensagem "Carteirinha vencida em dd/mm/aaaa. Atualize o cadastro do paciente."; outro convênio exige atualizar antes o cadastro do paciente (`CONVENIO_DIVERGENTE`).
        - **Sala:** obrigatória no presencial, da unidade escolhida e ativa (RN11).
        - **Consulta online (RN04):** o servidor gera o link do Google Meet. Se não conseguir, a consulta é gravada e a resposta traz o aviso `LINK_ONLINE_NAO_GERADO`.
        - **Credenciamento do convênio (RN35):** no tipo CONVENIO, o convênio precisa ter credenciamento APROVADO e vigente na unidade e na especialidade, na data da consulta. Sem isso: 409 `CONVENIO_NAO_CREDENCIADO` ("O convênio X não tem credenciamento aprovado para a unidade Y nesta especialidade. Agende como particular ou escolha outra unidade."). Só o administrador libera, enviando `liberacaoCredenciamento` com a justificativa e tendo `consulta.credenciamento:liberar`; sem essa liberação, 403 `LIBERACAO_CREDENCIAMENTO_NEGADA`. A liberação fica gravada na consulta.
        - **Aviso (RN16):** se o profissional não é o responsável atual do paciente, a resposta traz o aviso `PROFISSIONAL_NAO_RESPONSAVEL`, sem impedir o agendamento.
        - Quando o término não é informado, vale início + duração padrão. Registra o histórico de status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaEntrada'
      responses:
        '201':
          description: Consulta agendada com status AGENDADA.
          headers:
            Location:
              schema:
                type: string
              description: Endereço da nova consulta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaComAvisos'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /consultas/{consultaId}:
    parameters:
    - $ref: '#/components/parameters/ConsultaId'
    get:
      tags:
      - Consultas
      operationId: obterConsulta
      summary: Consultar uma consulta
      x-permissao: consulta.agendamento:visualizar
      description: |
        O perfil Médico só abre as próprias consultas (404 nas demais). Campos sem liberação não são enviados.
      responses:
        '200':
          description: Consulta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consulta'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags:
      - Consultas
      operationId: atualizarConsulta
      summary: Ajustar dados da consulta
      x-permissao: consulta.agendamento:editar
      description: |
        Ajusta modalidade, sala, tipo, convênio, valor e forma de pagamento. Convênio novo também exige credenciamento na unidade e especialidade da consulta (RN35, 409 `CONVENIO_NAO_CREDENCIADO`). Só em consulta AGENDADA, CONFIRMADA, CHECK_IN ou EM_ATENDIMENTO; depois da conclusão o valor fica travado para não mudar os relatórios financeiros (`STATUS_NAO_PERMITE`). Versão desatualizada retorna 409 `CONSULTA_ALTERADA` (G7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaAtualizacao'
      responses:
        '200':
          description: Consulta atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consulta'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /consultas/{consultaId}/horario:
    parameters:
    - $ref: '#/components/parameters/ConsultaId'
    put:
      tags:
      - Consultas
      operationId: ajustarTerminoConsulta
      summary: Ajustar o término da consulta
      x-permissao: consulta.agendamento:editar
      description: |
        Só o **término** muda aqui, por exemplo quando a avaliação dura mais (RN03). O novo término não pode sobrepor outra consulta do profissional (409 `HORARIO_INDISPONIVEL`). Para mudar o dia ou o início, use a remarcação (G5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioEntrada'
      responses:
        '200':
          description: Término ajustado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consulta'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /consultas/{consultaId}/status:
    parameters:
    - $ref: '#/components/parameters/ConsultaId'
    patch:
      tags:
      - Consultas
      operationId: alterarStatusConsulta
      summary: Alterar o status da consulta
      x-permissao: consulta.status:editar
      description: |
        Somente a recepção e o administrador alteram o status (RN15). O fluxo segue para a frente, sem pular etapas e sem voltar (G6):

        | De | Para |
        |---|---|
        | AGENDADA | CONFIRMADA, CANCELADA, FALTA |
        | CONFIRMADA | CHECK_IN, CANCELADA, FALTA |
        | CHECK_IN | EM_ATENDIMENTO, CANCELADA |
        | EM_ATENDIMENTO | CONCLUIDA |
        | AGENDADA, CONFIRMADA ou CHECK_IN | CONCLUIDA (atalho), só depois do horário da consulta (409 `CONCLUSAO_ANTES_DO_HORARIO`) |

        Outra mudança retorna 409 `TRANSICAO_INVALIDA`.
        - **Pagamento na chegada (G4, RN17):** no atendimento particular, o atendimento só começa com o pagamento confirmado. Sem ele, 409 `PAGAMENTO_PENDENTE` ao passar para EM_ATENDIMENTO. Fluxo da recepção: confirma o agendamento, faz o check-in, confirma o pagamento (`/pagamento/confirmacao`) e inicia o atendimento. **Convênio:** não há pagamento na chegada; o check-in acontece com a guia pendente, mas o atendimento só começa (e a consulta só conclui) com a guia AUTORIZADA pelo faturamento (`/consultas/{consultaId}/guia`); guia pendente ou negada retorna 409 `GUIA_NAO_AUTORIZADA`. O administrador pode liberar esta e as demais regras operacionais (convênio diferente do cadastro do paciente, convênio inativo, carteirinha vencida, pagamento pendente, antecedência do cancelamento, falta ou conclusão antes do horário, pular etapas do fluxo de consulta ativa) enviando `liberacaoAdministrador.justificativa`; consulta em status final (CONCLUIDA, CANCELADA, FALTA, REMARCADA) não muda.
        - **Carteirinha (G3):** no check-in de consulta por convênio com a carteirinha vencida, a resposta traz o aviso `CARTEIRINHA_VENCIDA` com a data de vencimento, para a recepção resolver na hora. Consulta CONCLUIDA, CANCELADA, FALTA ou REMARCADA não muda mais.
        - **Cancelamento e falta:** o motivo é obrigatório (RN06); no cancelamento informa-se também quem cancelou. Cancelar pelo **paciente** exige a antecedência mínima do parâmetro da agenda (48 horas): fora do prazo, 409 `CANCELAMENTO_FORA_DO_PRAZO`. A clínica pode cancelar a qualquer momento. Falta só depois do horário de início (`FALTA_ANTES_DO_HORARIO`).
        - **Cancelamento libera o horário:** o servidor avisa a recepção, dentro do sistema, quando há paciente na lista de espera daquele profissional ou especialidade (RN08).
        - Cada mudança grava o histórico de status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusEntrada'
      responses:
        '200':
          description: Status alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaComAvisos'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /consultas/{consultaId}/remarcacao:
    parameters:
    - $ref: '#/components/parameters/ConsultaId'
    post:
      tags:
      - Consultas
      operationId: remarcarConsulta
      summary: Remarcar a consulta
      x-permissao: consulta.agendamento:editar
      description: |
        Serve também para **antecipar**: se o paciente quer um horário mais cedo, a recepção remarca para o horário livre, com o motivo registrado. A recepção opera a agenda de qualquer profissional; o perfil Médico não remarca. Cria uma **nova consulta** vinculada à original (`consultaOrigemId`) e marca a original como REMARCADA, na mesma transação (RN06, G5). O motivo é obrigatório. A nova consulta repete os dados da original (paciente, especialidade, modalidade, tipo, valor e pagamento); profissional, especialidade, unidade e sala podem ser trocados. O pagamento já confirmado passa para a nova consulta. Valem as mesmas regras de horário e de sobreposição do agendamento, e a conferência do credenciamento do convênio (RN35) na nova data, unidade e especialidade; uma liberação do administrador na consulta original é mantida se a unidade e a especialidade não mudam. Só consulta AGENDADA ou CONFIRMADA pode ser remarcada. Não há antecedência mínima para remarcar. O horário liberado também avisa a lista de espera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemarcacaoEntrada'
      responses:
        '201':
          description: Nova consulta criada; a original passa a REMARCADA.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaComAvisos'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /consultas/{consultaId}/pagamento/confirmacao:
    parameters:
    - $ref: '#/components/parameters/ConsultaId'
    post:
      tags:
      - Consultas
      operationId: confirmarPagamentoConsulta
      summary: Confirmar o pagamento
      x-permissao: consulta.agendamento:editar
      description: |
        Feita pela recepção na chegada do paciente, antes do check-in (G4). Registra a confirmação com data, hora e usuário (RN17). Pagamento já confirmado retorna 409 `PAGAMENTO_JA_CONFIRMADO`. Só no atendimento particular e depois do check-in (consulta em CHECK_IN); no convênio retorna 409 `PAGAMENTO_CONVENIO_VIA_GUIA` (quem confirma é o faturamento, pela guia). Outro status retorna 409 `STATUS_NAO_PERMITE`; versão desatualizada, 409 `CONSULTA_ALTERADA`. A confirmação não é desfeita pela API. Grava no log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagamentoConfirmacaoEntrada'
      responses:
        '200':
          description: Pagamento confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consulta'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /faturamento/resumo:
    get:
      tags:
      - Consultas
      operationId: resumoFinanceiro
      summary: Resumo financeiro do faturamento
      x-permissao: faturamento.financeiro:visualizar
      description: |
        Totais das consultas **concluídas** no período (data da consulta, horário de Brasília; no máximo 1 ano). Particular: total, recebido (pagamento confirmado pela recepção) e sem pagamento confirmado. Convênio: total e quebra por situação da guia (autorizada, pendente, negada). Só informações financeiras. Grava no log (VISUALIZAR).
      parameters:
      - name: dataInicial
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: unidadeId
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Resumo do período.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoFinanceiro'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /faturamento/particulares:
    get:
      tags:
      - Consultas
      operationId: listarParticularesFaturamento
      summary: Listar as consultas particulares e a situação do pagamento
      x-permissao: faturamento.financeiro:visualizar
      description: |
        Consultas particulares (sem canceladas, remarcadas e faltas) com a situação do pagamento, para o faturamento acompanhar. A confirmação do pagamento é feita pela recepção, depois do check-in (`/consultas/{consultaId}/pagamento/confirmacao`).
      parameters:
      - name: pagamento
        in: query
        schema:
          type: string
          enum:
          - PENDENTE
          - CONFIRMADO
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: dataInicial
        in: query
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        schema:
          type: string
          format: date
      - name: busca
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de consultas particulares.
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      type: object
                      properties:
                        consultaId:
                          type: string
                          format: uuid
                        inicio:
                          type: string
                          format: date-time
                        statusConsulta:
                          type: string
                        pacienteId:
                          type: string
                          format: uuid
                          description: Identificador do paciente, para abrir o cadastro direto da tela do faturamento.
                        paciente:
                          type: string
                        profissional:
                          type: string
                        especialidade:
                          type: string
                        unidade:
                          type: string
                        valor:
                          type: number
                          format: decimal
                        formaPagamento:
                          type: string
                        pagamentoConfirmado:
                          type: boolean
                        pagamentoConfirmadoEm:
                          type: string
                          format: date-time
                          nullable: true
                        pagamentoConfirmadoPor:
                          type: string
                          nullable: true
                  pagina:
                    type: integer
                  tamanho:
                    type: integer
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /faturamento/exportacao:
