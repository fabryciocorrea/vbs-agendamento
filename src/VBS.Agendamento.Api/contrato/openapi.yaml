      description: |
        Caixa de entrada de avisos dentro do sistema. Cada usuário com a liberação da tela vê as notificações dirigidas a todos e as dirigidas a ele. Filtre por `lida` para ver só as pendentes. As notificações não são excluídas (RNF05).
      parameters:
      - name: tipo
        in: query
        schema:
          type: string
          enum:
          - HORARIO_DISPONIVEL
          - SEM_RESPOSTA_48H
          - SEM_RESPOSTA_24H
          - CONTATO_MANUAL
          - RESPOSTA_PACIENTE
          - FALHA_ENVIO
          - CREDENCIAMENTO
      - name: lida
        in: query
        schema:
          type: boolean
      - name: consultaId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificacaoInternaPagina'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /notificacoes-internas/nao-lidas/contagem:
    get:
      tags:
