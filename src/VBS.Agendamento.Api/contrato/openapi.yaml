  /notificacoes-internas/{notificacaoId}/leitura:
    parameters:
    - $ref: '#/components/parameters/NotificacaoId'
    patch:
      tags:
      - Notificações internas
      operationId: marcarNotificacaoLida
      summary: Marcar como lida
      x-permissao: notificacao.interna:editar
      description: |
        Quando um usuário lê, a notificação fica lida **para toda a recepção**, com o nome de quem leu e a hora, para a equipe não tratar o mesmo aviso duas vezes. Marcar de novo não muda nada.
      responses:
