openapi: 3.0.3
info:
  title: API do Sistema de Agendamento de Consultas - Viver Bem Saúde
  version: 1.0.0-rc.1
  description: |-
    # API do Sistema de Agendamento de Consultas - Viver Bem Saúde

    Contrato completo da API (OpenAPI 3.0.3), reunindo os blocos 1 a 7, incluindo o mini-bloco 3A. Base: Projeto de Desenvolvimento v2.24 e scripts de banco 01 a 11 (banco VBSAGENDA, SQL Server).

    ## Blocos
    | Bloco | Conteúdo | Grupos (tags) |
    |---|---|---|
    | 1 | Autenticação, usuários e perfis | Autenticação, Usuários, Perfis |
    | 2 | Pacientes e responsáveis legais | Pacientes |
    | 3 | Cadastros: unidades, salas, convênios, formas de pagamento, colaboradores, especialidades, profissionais e listas de apoio | vários |
    | 3A | Credenciamento de convênios por unidade e especialidade | Credenciamento |
    | 4 | Agenda, consultas, lista de espera, parâmetros da agenda e feriados | Agenda, Consultas, Lista de espera, Parâmetros da agenda |
    | 5 | Prontuário do paciente | Prontuário |
    | 6 | Notificações: avisos internos, mensagens ao paciente e webhooks do provedor | Notificações internas, Mensagens ao paciente, Parâmetros das notificações, Webhooks do provedor |
    | 7 | Dashboards, relatórios, exportação e auditoria | Dashboards, Relatórios, Exportação, Auditoria |

    ## Convenções gerais
    - JSON em UTF-8, nomes em camelCase. Datas e horas em ISO 8601 e em UTC; a interface converte para o horário de Brasília. Regras de dia (relatórios, feriados, expediente) valem no horário de Brasília.
    - Autenticação por `Authorization: Bearer <accessToken>`. A sessão expira após 30 minutos de inatividade. Só as rotas públicas de `/auth` e os webhooks (assinatura HMAC) dispensam o token.
    - **Autorização no servidor (RNF08):** cada operação exige uma tela e uma ação (`x-permissao`, por exemplo `usuario.cadastro:incluir`), conferidas a cada requisição, além do controle campo a campo.
    - Erros em `application/problem+json` (RFC 7807), com `codigo` da regra de negócio e a lista `erros` por campo.
    - Paginação com `pagina` e `tamanho` (padrão 20, máximo 100).
    - Identificadores públicos (GUID) para paciente, consulta e registro de prontuário; demais cadastros usam código inteiro.
    - Cadastros não são excluídos, só inativados (RN14). Toda ação relevante grava o log de auditoria (RNF05).
    - Dados de saúde e financeiros não ficam em cache (`Cache-Control: no-store`).

    ## Regras que atravessam os blocos
    - **Médico (RN20):** o usuário vinculado a um profissional vê só a própria agenda, o cadastro (somente leitura) e o prontuário dos seus pacientes; nunca vê valores, dashboards, relatórios nem log.
    - **Prontuário:** acesso do profissional responsável atual e do administrador; o administrador só inclui ou edita com solicitação do profissional e OK do responsável legal; nada é excluído.
    - **Convênio:** só vale na consulta com credenciamento aprovado e vigente na unidade e na especialidade; só o administrador libera exceção, com justificativa.
    - **Agenda:** sem sobreposição de horários do profissional (RN09), com controle de edição simultânea por `versao`.

    ## Pendências de projeto
    Escolha do provedor de SMS e WhatsApp (P18, os webhooks já são independentes do provedor) e política de retenção do log de auditoria (RNF04).
  contact:
    name: Diretoria de TI - Viver Bem Saúde
servers:
- url: http://localhost:5000/api/v1
  description: Desenvolvimento local
security:
- bearerAuth: []
tags:
- name: Autenticação
  description: Login, logout, expiração por inatividade e recuperação de senha (RF01).
- name: Usuários
  description: Cadastro de usuários do sistema, feito somente pelo administrador (RF08).
- name: Perfis de acesso
  description: Perfis configuráveis e liberações campo a campo (RF26, RN21 a RN23).
- name: Catálogo de telas
  description: Telas e campos disponíveis para liberação.
- name: Pacientes
  description: Cadastro, consulta e inativação de pacientes (RF03, RN25).
- name: Profissional responsável
  description: Troca do profissional que atende o paciente e histórico (RN18).
- name: Consentimentos LGPD
  description: Histórico de consentimentos do paciente (RNF03).
- name: Responsáveis legais
  description: Responsáveis por pacientes menores de 18 anos (seção 6.1.1).
- name: Unidades
- name: Salas
- name: Convênios
- name: Formas de pagamento
- name: Colaboradores e prestadores
- name: Especialidades
- name: Profissionais
- name: Listas de apoio
- name: Credenciamento
- name: Agenda
- name: Consultas
- name: Lista de espera
- name: Parâmetros da agenda
- name: Prontuário
- name: Notificações internas
- name: Mensagens ao paciente
- name: Parâmetros das notificações
- name: Webhooks do provedor
- name: Dashboards
- name: Relatórios
- name: Exportação
- name: Auditoria
paths:
  /auth/login:
    post:
      tags:
      - Autenticação
      operationId: login
      summary: Entrar no sistema
      description: |
        Valida usuário e senha. A mensagem de falha é sempre genérica, para não revelar se o usuário existe.
        Cada falha soma em `tentativas_falhas`; ao atingir o limite (D5) o usuário fica bloqueado (423) até o administrador desbloquear. Login correto zera o contador.
        Usuário inativo recebe a mesma resposta de credenciais inválidas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
            example:
              nomeUsuario: fabrycio.correa
              senha: '********'
      responses:
        '200':
          description: Login realizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoSaida'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '423':
          description: Usuário bloqueado por tentativas inválidas. Só o administrador desbloqueia.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                title: Usuário bloqueado
                status: 423
                detail: Usuário bloqueado por excesso de tentativas. Peça o desbloqueio ao administrador.
        '429':
          $ref: '#/components/responses/MuitasRequisicoes'
      x-permissao: pública
  /auth/logout:
    post:
      tags:
      - Autenticação
      operationId: logout
      summary: Sair do sistema
      description: Encerra a sessão atual (`sessao_usuario.data_encerramento`, motivo LOGOUT).
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
      x-permissao: logado
  /auth/eu:
    get:
      tags:
      - Autenticação
      operationId: obterUsuarioAtual
      summary: Dados do usuário logado e suas liberações
      description: |
        Devolve o usuário, o perfil e as liberações por tela e por campo. A interface usa isso para montar menus e telas.
        O servidor continua conferindo a permissão em cada requisição (RNF08).
      responses:
        '200':
          description: Usuário atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAtualSaida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
      x-permissao: logado
  /auth/recuperar-senha:
    post:
      tags:
      - Autenticação
      operationId: solicitarRecuperacaoSenha
      summary: Solicitar a recuperação de senha
      description: |
        Se existir um usuário ativo com o e-mail informado, envia a ele um link com token de uso único e validade de 30 minutos (D2).
        O e-mail é único por usuário, então a conta é identificada sem ambiguidade.
        Só o hash do token é guardado (`token_recuperacao_senha.token_hash`).
        A resposta é sempre 202, exista ou não o e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarSenhaEntrada'
      responses:
        '202':
          description: Solicitação recebida.
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '429':
          $ref: '#/components/responses/MuitasRequisicoes'
      x-permissao: pública
  /auth/redefinir-senha:
    post:
      tags:
      - Autenticação
      operationId: redefinirSenha
      summary: Definir a nova senha com o token recebido por e-mail
      description: |
        Confere o token (existente, não expirado e não usado), grava a nova senha com hash e marca `data_troca_senha`.
        Encerra as sessões abertas do usuário. **Não desbloqueia** um usuário bloqueado: só o administrador desbloqueia (D5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaEntrada'
      responses:
        '204':
          description: Senha alterada.
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '410':
          description: Token inválido, expirado ou já utilizado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      x-permissao: pública
  /usuarios:
    get:
      tags:
      - Usuários
      operationId: listarUsuarios
      summary: Listar usuários
      x-permissao: usuario.cadastro:visualizar
      parameters:
      - name: busca
        in: query
        description: Parte do nome de usuário, do nome completo ou do e-mail.
        schema:
          type: string
      - name: perfilId
        in: query
        schema:
          type: integer
      - name: ativo
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de usuários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPagina'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
      - Usuários
      operationId: criarUsuario
      summary: Cadastrar usuário
      description: |
        Somente o administrador (ou quem tiver a liberação) cadastra usuários; não há autocadastro.
        O nome de usuário e o e-mail não podem se repetir (RN13 e D2): o servidor responde 409 com "Este e-mail já está cadastrado" ou "Este nome de usuário já está cadastrado".
      x-permissao: usuario.cadastro:incluir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEntrada'
      responses:
        '201':
          description: Usuário criado.
          headers:
            Location:
              schema:
                type: string
              description: Endereço do novo usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
  /usuarios/{usuarioId}:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    get:
      tags:
      - Usuários
      operationId: obterUsuario
      summary: Consultar um usuário
      x-permissao: usuario.cadastro:visualizar
      responses:
        '200':
          description: Usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags:
      - Usuários
      operationId: atualizarUsuario
      summary: Alterar os dados de um usuário
      description: A senha não é alterada aqui; use `/usuarios/{usuarioId}/senha`. O e-mail não pode ser o de outro usuário (409).
      x-permissao: usuario.cadastro:editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioAtualizacao'
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
    delete:
      tags:
      - Usuários
      operationId: excluirUsuario
      summary: Excluir usuário
      x-permissao: usuario.cadastro:excluir
      description: |
        Exclusão definitiva, **somente para o administrador**, de o usuário sem histórico (sem consultas, prontuário, lista de espera ou outros vínculos). Vínculos de cadastro (por exemplo, especialidades de um profissional) saem junto. Com histórico responde `409 REGISTRO_COM_VINCULOS`: use inativar. A exclusão fica no log de auditoria (ação EXCLUIR).
      responses:
        '204':
          description: Excluído.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /usuarios/{usuarioId}/status:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    patch:
      tags:
      - Usuários
      operationId: alterarStatusUsuario
      summary: Ativar ou inativar um usuário
      description: Inativar substitui a exclusão (RN14). Inativar encerra as sessões abertas do usuário.
      x-permissao: usuario.cadastro:editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ativo
              properties:
                ativo:
                  type: boolean
      responses:
        '200':
          description: Status alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /usuarios/{usuarioId}/desbloquear:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    post:
      tags:
      - Usuários
      operationId: desbloquearUsuario
      summary: Desbloquear um usuário bloqueado por tentativas inválidas
      description: Zera `tentativas_falhas` e limpa `data_bloqueio`. É a única forma de liberar um usuário bloqueado (D5).
      x-permissao: usuario.cadastro:editar
      responses:
        '204':
          description: Usuário desbloqueado.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /usuarios/{usuarioId}/senha:
    parameters:
    - $ref: '#/components/parameters/UsuarioId'
    put:
      tags:
      - Usuários
      operationId: redefinirSenhaUsuario
      summary: O administrador define uma nova senha para o usuário
      description: Encerra as sessões abertas do usuário. A senha é gravada somente com hash (RNF06). Não desbloqueia um usuário bloqueado (D5).
      x-permissao: usuario.cadastro:editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - novaSenha
              properties:
                novaSenha:
                  $ref: '#/components/schemas/Senha'
      responses:
        '204':
          description: Senha alterada.
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /perfis:
    get:
      tags:
      - Perfis de acesso
      operationId: listarPerfis
      summary: Listar perfis de acesso
      x-permissao: perfil.cadastro:visualizar
      responses:
        '200':
          description: Perfis cadastrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerfilResumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
      - Perfis de acesso
      operationId: criarPerfil
      summary: Incluir um perfil com as suas liberações
      description: |
        A tela de inclusão envia o nome, a descrição e as liberações por tela e por campo (RF26).
        Se algum campo obrigatório de uma tela com incluir ou editar liberado não estiver liberado para edição, a resposta traz `avisos` (RN23). O perfil é salvo mesmo assim.
        Use `/perfis/validacao` para obter os avisos antes de salvar.
      x-permissao: perfil.cadastro:incluir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilEntrada'
      responses:
        '201':
          description: Perfil criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilComAvisos'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
  /perfis/validacao:
    post:
      tags:
      - Perfis de acesso
      operationId: validarPerfil
      summary: Conferir as liberações sem salvar
      description: Devolve os avisos da RN23 (campos obrigatórios não liberados para edição) para a tela exibir antes de salvar.
      x-permissao: perfil.cadastro:incluir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilEntrada'
      responses:
        '200':
          description: Resultado da conferência.
          content:
            application/json:
              schema:
                type: object
                required:
                - avisos
                properties:
                  avisos:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvisoPerfil'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /perfis/{perfilId}:
    parameters:
    - $ref: '#/components/parameters/PerfilId'
    get:
      tags:
      - Perfis de acesso
      operationId: obterPerfil
      summary: Consultar um perfil com todas as liberações
      x-permissao: perfil.cadastro:visualizar
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags:
      - Perfis de acesso
      operationId: atualizarPerfil
      summary: Alterar um perfil e as suas liberações
      description: |
        Substitui o nome, a descrição e todas as liberações do perfil.
        O perfil Administrador é protegido: não pode ser editado nem perder liberações (RN21); a resposta é 403.
      x-permissao: perfil.cadastro:editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilEntrada'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilComAvisos'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
    delete:
      tags:
      - Perfis de acesso
      operationId: excluirPerfil
      summary: Excluir um perfil
      description: |
        Bloqueada nos casos da RN21:
        - perfil com usuário vinculado: **409**, informando a quantidade de usuários;
        - perfil Administrador (protegido): **403**.
      x-permissao: perfil.cadastro:excluir
      responses:
        '204':
          description: Perfil excluído.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /telas:
    get:
      tags:
      - Catálogo de telas
      operationId: listarTelas
      summary: Telas e campos disponíveis para liberação
      description: Base da tela de inclusão de perfil (RF26). Cada tela traz os seus campos e se cada campo é obrigatório.
      x-permissao: perfil.cadastro:visualizar
      responses:
        '200':
          description: Catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tela'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /pacientes:
    get:
      tags:
      - Pacientes
      operationId: listarPacientes
      summary: Listar pacientes
      description: |
        Ordenada por nome. O perfil Médico recebe somente os pacientes de que é o profissional responsável atual (RN16).
        Para buscar por CPF use `POST /pacientes/busca-por-cpf` (E1).
      x-permissao: paciente.cadastro:visualizar
      parameters:
      - name: busca
        in: query
        description: Parte do nome ou do telefone (somente dígitos).
        schema:
          type: string
          maxLength: 150
      - name: ativo
        in: query
        schema:
          type: boolean
      - name: profissionalId
        in: query
        description: Filtra pelo profissional responsável atual.
        schema:
          type: integer
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: menorDeIdade
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de pacientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacientePagina'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
      - Pacientes
      operationId: criarPaciente
      summary: Cadastrar paciente
      description: |
        Regras de validação (todas conferidas no servidor):
        - **CPF (RN25):** obrigatório, com dígitos válidos e sem duplicidade (409 "Este CPF já está cadastrado").
        - **Paciente estrangeiro:** com `estrangeiro` verdadeiro o CPF deixa de ser obrigatório, mas continua validado quando informado. Sem CPF, `tipoDocumentoEstrangeiro` e `numeroDocumentoEstrangeiro` passam a ser obrigatórios. Com `estrangeiro` falso, os campos de documento alternativo não podem ser enviados.
        - **Menor de 18 anos (E4):** `responsavelLegalId` obrigatório. Se o responsável não existir, responde 400 com `codigo` `RESPONSAVEL_NAO_CADASTRADO` e a mensagem "Este responsável não está cadastrado. Cadastre-o para concluir o cadastro do paciente." A tela leva o usuário a cadastrá-lo (`POST /responsaveis-legais`) e volta ao paciente.
        - **Convênio:** `convenio` traz convênio, número e validade da carteirinha juntos, ou nenhum dos três.
        - **Profissional responsável (RN18):** obrigatório; o servidor grava a primeira linha do histórico.
        - **Consentimentos (E3):** `consentimentos` deve trazer `TRATAMENTO_DADOS` concedido; `CONTATO_SMS_WHATSAPP` pode ser concedido ou recusado.
      x-permissao: paciente.cadastro:incluir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteEntrada'
            examples:
              adulto:
                summary: Adulto com CPF e convênio
                value:
                  nome: Maria Souza Lima (fictícia)
                  estrangeiro: false
                  cpf: '52998224725'
                  dataNascimento: '1988-04-12'
                  telefone: '11987654321'
                  email: maria.lima@exemplo.com.br
                  endereco: Rua das Flores, 100, apto 12
                  cidade: São Paulo
                  uf: SP
                  escolaridade: Superior completo
                  convenio:
                    convenioId: 3
                    numeroCarteirinha: 0012345678
                    dataValidadeCarteirinha: '2027-06-30'
                  profissionalResponsavelId: 7
                  consentimentos:
                  - finalidade: TRATAMENTO_DADOS
                    concedido: true
                    origem: PRESENCIAL
                  - finalidade: CONTATO_SMS_WHATSAPP
                    concedido: true
                    origem: PRESENCIAL
              menorComResponsavel:
                summary: Menor de idade, com CPF e responsável legal
                value:
                  nome: Pedro Souza Lima (fictício)
                  estrangeiro: false
                  cpf: '52998224725'
                  dataNascimento: '2018-09-03'
                  telefone: '11987654321'
                  email: maria.lima@exemplo.com.br
                  endereco: Rua das Flores, 100, apto 12
                  cidade: São Paulo
                  uf: SP
                  profissionalResponsavelId: 7
                  responsavelLegalId: 15
                  consentimentos:
                  - finalidade: TRATAMENTO_DADOS
                    concedido: true
                    origem: PRESENCIAL
                  - finalidade: CONTATO_SMS_WHATSAPP
                    concedido: false
                    origem: PRESENCIAL
      responses:
        '201':
          description: Paciente criado.
          headers:
            Location:
              schema:
                type: string
              description: Endereço do novo paciente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paciente'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          $ref: '#/components/responses/Conflito'
  /pacientes/busca-por-cpf:
    post:
      tags:
      - Pacientes
      operationId: buscarPacientePorCpf
      summary: Buscar paciente pelo CPF
      description: |
        O CPF vai no corpo, não na URL (E1). Serve para a recepção localizar o paciente e para evitar cadastro duplicado antes de preencher o formulário.
        Retorna 404 com `codigo` `PACIENTE_NAO_CADASTRADO` quando não houver paciente com esse CPF (ou, para o perfil Médico, quando o paciente não for dele).
      x-permissao: paciente.cadastro:visualizar
      requestBody:
        required: true
