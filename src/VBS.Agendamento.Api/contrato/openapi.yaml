      operationId: listarCredenciamentos
      summary: Listar os credenciamentos de todos os convênios
      x-permissao: convenio.credenciamento:visualizar
      description: |
        Visão geral para conferir, por exemplo, tudo o que a filial já tem aprovado. Combine `unidadeId`, `convenioId` e `vigente`. Ordenada por convênio, unidade e especialidade.
      parameters:
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: especialidadeId
        in: query
        schema:
          type: integer
      - name: situacao
        in: query
        schema:
          type: string
          enum:
          - APROVADO
          - EM_ANALISE
          - NAO_CREDENCIADO
      - name: vigente
        in: query
        description: 'Verdadeiro: só os aprovados e dentro da vigência hoje.'
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de credenciamentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredenciamentoPagina'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /convenios/{convenioId}/credenciamentos:
    parameters:
    - $ref: '#/components/parameters/ConvenioId'
    get:
      tags:
      - Credenciamento
      operationId: listarCredenciamentosConvenio
      summary: Listar os credenciamentos de um convênio
      x-permissao: convenio.credenciamento:visualizar
      parameters:
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: especialidadeId
        in: query
        schema:
          type: integer
      - name: situacao
        in: query
        schema:
          type: string
          enum:
          - APROVADO
          - EM_ANALISE
          - NAO_CREDENCIADO
      - name: vigente
        in: query
        description: 'Verdadeiro: só os aprovados e dentro da vigência hoje.'
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de credenciamentos do convênio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredenciamentoPagina'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags:
      - Credenciamento
      operationId: incluirCredenciamento
      summary: Incluir credenciamento
      x-permissao: convenio.credenciamento:incluir
      description: |
        Registra a situação do convênio em **uma unidade e uma especialidade** (J2). A unidade define a cidade: Sapucaia do Sul (matriz) e Porto Alegre (filial) têm credenciamentos independentes.
        - Situação APROVADO exige `dataInicio` (400 `VIGENCIA_INVALIDA` quando falta ou quando `dataFim` é anterior).
        - Combinação convênio, unidade e especialidade já cadastrada: 409 `CREDENCIAMENTO_DUPLICADO` (use a alteração).
        - Unidade ou especialidade inativa: 400 `UNIDADE_OU_ESPECIALIDADE_INATIVA`.
        - Não há exclusão: o histórico se mantém e a situação muda por alteração (NAO_CREDENCIADO ou data de fim). Toda inclusão e alteração grava no log (RNF05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredenciamentoEntrada'
      responses:
        '201':
          description: Credenciamento incluído.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credenciamento'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
  /convenios/{convenioId}/valor-consulta:
