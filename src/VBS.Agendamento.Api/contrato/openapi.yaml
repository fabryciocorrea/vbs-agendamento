  /relatorios/ocupacao-agenda:
    get:
      tags:
      - Relatórios
      operationId: relatorioOcupacaoAgenda
      summary: Taxa de ocupação da agenda
      x-permissao: relatorio.ocupacao:visualizar
      description: |
        Nunca disponível ao usuário vinculado a profissional (médico), mesmo que o perfil tenha a liberação: 403 `MEDICO_SEM_ACESSO` (RN20, L10). Filtros do RF22 (período, profissional, unidade, convênio e tipo). Período de no máximo 366 dias; fora disso, 400 `PERIODO_INVALIDO`. Datas e horas no horário de Brasília. Cada geração é gravada no log. A ocupação é calculada em minutos: duração das consultas dentro do expediente dividida pelo expediente disponível, sem intervalos, feriados nacionais e recesso. Canceladas e remarcadas não contam como ocupadas. Encaixes ficam de fora do cálculo e aparecem à parte (L4).
      parameters:
