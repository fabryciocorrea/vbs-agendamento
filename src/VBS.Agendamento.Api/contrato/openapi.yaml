  /consultas/{consultaId}/guia:
    parameters:
    - $ref: '#/components/parameters/ConsultaId'
    patch:
      tags:
      - Consultas
      operationId: atualizarGuiaConsulta
      summary: Registrar a guia do convênio
      x-permissao: faturamento.financeiro:editar
      description: |
        Feita pelo faturamento quando o plano de saúde aprova (ou nega) a solicitação de guia. No convênio o pagamento só vale com a guia autorizada: o atendimento (check-in e conclusão) acontece normalmente com a guia pendente, sem bloquear a recepção. AUTORIZADA exige o número da guia e confirma o pagamento da consulta; NEGADA exige o motivo; PENDENTE ou NEGADA desfaz a confirmação (correção do faturamento). Só em consulta por convênio (409 `CONSULTA_NAO_CONVENIO`) e que não esteja cancelada nem remarcada (409 `STATUS_NAO_PERMITE`). A remarcação leva a guia para a nova consulta. Grava no log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaEntrada'
      responses:
        '200':
          description: Guia atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuiaItem'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
