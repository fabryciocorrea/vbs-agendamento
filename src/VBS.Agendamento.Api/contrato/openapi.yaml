      summary: Cancelamentos e não comparecimentos
      x-permissao: relatorio.cancelamentos_faltas:visualizar
      description: |
        Nunca disponível ao usuário vinculado a profissional (médico), mesmo que o perfil tenha a liberação: 403 `MEDICO_SEM_ACESSO` (RN20, L10). Filtros do RF22 (período, profissional, unidade, convênio e tipo). Período de no máximo 366 dias; fora disso, 400 `PERIODO_INVALIDO`. Datas e horas no horário de Brasília. Cada geração é gravada no log. `visao` RESUMO (padrão) traz os totais por profissional; DETALHE traz também a lista paginada, com paciente, data, motivo e quem cancelou (L5).
      parameters:
      - name: dataInicial
        in: query
        required: true
        description: Início do período, no horário de Brasília.
        schema:
          type: string
          format: date
      - name: dataFinal
        in: query
        required: true
        description: Fim do período, inclusive. No máximo 366 dias depois do início.
        schema:
          type: string
          format: date
      - name: profissionalId
        in: query
        schema:
          type: integer
      - name: unidadeId
        in: query
        schema:
          type: integer
      - name: convenioId
        in: query
        schema:
          type: integer
      - name: tipoAtendimento
        in: query
        schema:
          type: string
          enum:
          - PARTICULAR
          - CONVENIO
      - name: visao
        in: query
        schema:
          type: string
          enum:
          - RESUMO
          - DETALHE
          default: RESUMO
      - name: pagina
