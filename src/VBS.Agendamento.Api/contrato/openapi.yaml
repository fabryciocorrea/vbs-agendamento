    put:
      tags:
      - Pacientes
      operationId: atualizarPaciente
      summary: Alterar o cadastro de um paciente
      description: |
        Mesmas regras de validação do cadastro (RN25, E4). Não altera o profissional responsável, o status nem os consentimentos, que têm operações próprias.
        Valor diferente em campo sem liberação de edição retorna 403 com os campos (E2).
        Vale a última gravação (sem controle de edição simultânea).
      x-permissao: paciente.cadastro:editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteAtualizacao'
      responses:
        '200':
          description: Paciente atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paciente'
        '400':
          $ref: '#/components/responses/ValidacaoErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
    delete:
      tags:
      - Pacientes
      operationId: excluirPaciente
      summary: Excluir paciente
      x-permissao: paciente.cadastro:excluir
