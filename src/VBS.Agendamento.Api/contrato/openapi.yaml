            $ref: '#/components/schemas/ListaEspera'
        pagina:
          type: integer
        tamanho:
          type: integer
        total:
          type: integer
    ParametrosAgenda:
      type: object
      required:
      - duracaoPadraoConsultaMin
      - antecedenciaCancelamentoHoras
      properties:
        duracaoPadraoConsultaMin:
          type: integer
          minimum: 5
          maximum: 240
          description: Duração padrão da consulta (RN03). Hoje 45.
        limiteEncaixesDia:
          type: integer
          nullable: true
          minimum: 0
          description: 'Máximo de encaixes por profissional e por dia. Vazio: sem limite.'
        recessoFimAnoInicio:
          type: string
          format: date
          nullable: true
        recessoFimAnoFim:
          type: string
          format: date
          nullable: true
          description: Obrigatório quando o início é informado, e não pode ser anterior a ele.
        antecedenciaCancelamentoHoras:
          type: integer
          minimum: 0
          maximum: 720
          description: Antecedência mínima para o paciente cancelar (RN06). Hoje 48.
    Feriado:
      type: object
      required:
      - data
      - nome
      properties:
        data:
          type: string
          format: date
        nome:
          type: string
          maxLength: 80
    ProfissionalRegistro:
      type: object
      description: Dados do profissional guardados no próprio registro (RN19). Não mudam se o cadastro do profissional mudar depois.
      required:
      - id
      - nome
      - registroProfissional
      - numeroConselho
      - ufConselho
      properties:
        id:
          type: integer
        nome:
          type: string
          description: Nome do profissional no momento do registro.
        registroProfissional:
          type: string
          enum:
          - CRM
          - CRP
        numeroConselho:
          type: string
        ufConselho:
          type: string
          minLength: 2
          maxLength: 2
    AutorizacaoProntuario:
      type: object
      description: Autorização obrigatória quando o administrador inclui ou edita um registro (H3). É gravada junto com o registro e no log.
      required:
      - solicitadoPor
      - autorizadoPor
      - observacao
      properties:
        solicitadoPor:
          type: string
          minLength: 3
          maxLength: 150
          description: Nome do profissional que solicitou a inclusão ou a alteração.
        autorizadoPor:
          type: string
          minLength: 3
          maxLength: 150
          description: Nome do responsável legal (ou do próprio paciente, quando maior de idade) que deu o OK.
        observacao:
          type: string
          minLength: 10
          maxLength: 1000
          description: 'Observação da autorização: como e quando a solicitação e o OK foram dados. Não deve conter texto clínico.'
    RegistroProntuarioEntrada:
      type: object
      required:
      - observacao
      properties:
        observacao:
          type: string
          minLength: 1
          maxLength: 20000
          description: Texto livre do atendimento.
        consultaId:
          type: string
          format: uuid
          nullable: true
          description: Consulta que originou o registro. Opcional. Deve ser do mesmo paciente e do mesmo profissional, em atendimento ou concluída.
        profissionalId:
          type: integer
          nullable: true
          description: 'Só para o administrador: profissional em nome de quem o registro é incluído (o que solicitou). Obrigatório para o administrador;
            não deve ser enviado pelo profissional.'
        autorizacao:
          allOf:
          - $ref: '#/components/schemas/AutorizacaoProntuario'
          nullable: true
          description: Obrigatória para o administrador; não deve ser enviada pelo profissional.
    RegistroProntuarioEdicao:
      type: object
      description: Edição de um registro pelo administrador (H3).
      required:
      - observacao
      - autorizacao
      properties:
        observacao:
          type: string
          minLength: 1
          maxLength: 20000
          description: Novo texto do registro. O texto anterior fica guardado no histórico de correções.
        autorizacao:
          $ref: '#/components/schemas/AutorizacaoProntuario'
    InclusaoAdministrativa:
      type: object
      description: Preenchido quando o registro foi incluído pelo administrador em nome do profissional.
      required:
      - incluidoPor
      - solicitadoPor
      - autorizadoPor
      - observacaoAutorizacao
      properties:
        incluidoPor:
          $ref: '#/components/schemas/UsuarioReferencia'
        solicitadoPor:
          type: string
        autorizadoPor:
          type: string
        observacaoAutorizacao:
          type: string
    RegistroProntuario:
      type: object
      required:
      - id
      - paciente
      - profissional
      - registradoEm
      - observacao
      - corrigido
      properties:
        id:
          type: string
          format: uuid
        paciente:
          $ref: '#/components/schemas/PacienteReferencia'
        consultaId:
          type: string
          format: uuid
          nullable: true
        profissional:
          $ref: '#/components/schemas/ProfissionalRegistro'
        registradoEm:
          type: string
          format: date-time
        observacao:
          type: string
        inclusaoAdministrativa:
          allOf:
          - $ref: '#/components/schemas/InclusaoAdministrativa'
          nullable: true
        corrigido:
          type: boolean
          description: Verdadeiro quando o texto foi alterado depois de salvo (pelo administrador no sistema ou pela Diretoria de TI no banco).
        corrigidoEm:
          type: string
          format: date-time
          nullable: true
          description: Data da última alteração.
    RegistroProntuarioPagina:
      type: object
      required:
      - itens
      - pagina
      - tamanho
      - total
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/RegistroProntuario'
        pagina:
          type: integer
        tamanho:
          type: integer
        total:
          type: integer
    CorrecaoProntuario:
      type: object
      required:
      - origem
      - observacaoAnterior
      - observacaoNova
      - solicitadoPor
      - autorizadoPor
      - observacaoAutorizacao
      - executadoPor
      - corrigidoEm
      properties:
        origem:
          type: string
          enum:
          - SISTEMA
          - BANCO
          description: 'SISTEMA: administrador na tela. BANCO: correção direta pela Diretoria de TI.'
        observacaoAnterior:
          type: string
        observacaoNova:
          type: string
        solicitadoPor:
          type: string
          description: Profissional que solicitou a alteração.
        autorizadoPor:
          type: string
          description: Responsável legal que deu o OK.
        observacaoAutorizacao:
          type: string
          description: Observação da autorização.
        executadoPor:
          type: string
          description: Nome do administrador (origem SISTEMA) ou conta do banco de dados (origem BANCO).
        corrigidoEm:
          type: string
          format: date-time
    ConsultaNotificacao:
      type: object
      description: Consulta a que o aviso se refere, para a tela abrir direto nela.
      required:
      - id
      - inicio
      - paciente
      properties:
        id:
          type: string
          format: uuid
        inicio:
          type: string
          format: date-time
        paciente:
          type: object
          required:
          - id
          - nome
          properties:
            id:
              type: string
              format: uuid
            nome:
              type: string
      nullable: true
    NotificacaoInterna:
      type: object
      required:
      - id
      - tipo
      - mensagem
      - criadaEm
      - lida
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum:
          - HORARIO_DISPONIVEL
          - SEM_RESPOSTA_48H
          - SEM_RESPOSTA_24H
          - CONTATO_MANUAL
          - RESPOSTA_PACIENTE
          - FALHA_ENVIO
          - CREDENCIAMENTO
          description: 'HORARIO_DISPONIVEL: horário liberado com paciente na lista de espera. SEM_RESPOSTA_48H e SEM_RESPOSTA_24H: paciente sem
            resposta à confirmação ou ao lembrete. CONTATO_MANUAL: paciente sem consentimento de contato, a recepção confirma por telefone. RESPOSTA_PACIENTE:
            paciente respondeu "não" ou algo diferente de sim. FALHA_ENVIO: mensagem não entregue por nenhum canal. CREDENCIAMENTO: convênio deixou
            de ter credenciamento.'
        mensagem:
          type: string
        consulta:
          $ref: '#/components/schemas/ConsultaNotificacao'
        criadaEm:
          type: string
          format: date-time
        lida:
          type: boolean
        lidaEm:
          type: string
          format: date-time
          nullable: true
        lidaPor:
          $ref: '#/components/schemas/UsuarioReferencia'
    NotificacaoInternaPagina:
      type: object
      required:
      - itens
      - pagina
      - tamanho
      - total
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/NotificacaoInterna'
        pagina:
          type: integer
        tamanho:
          type: integer
        total:
          type: integer
    ContagemNaoLidas:
      type: object
      description: Para o contador da tela da recepção.
      required:
      - total
      - porTipo
      properties:
        total:
          type: integer
        porTipo:
          type: array
          items:
            type: object
            required:
            - tipo
            - total
            properties:
              tipo:
                type: string
                enum:
                - HORARIO_DISPONIVEL
                - SEM_RESPOSTA_48H
                - SEM_RESPOSTA_24H
                - CONTATO_MANUAL
                - RESPOSTA_PACIENTE
                - FALHA_ENVIO
                - CREDENCIAMENTO
              total:
                type: integer
    NotificacaoPaciente:
      type: object
      required:
      - id
      - tipo
      - canal
      - agendadaPara
      - statusEntrega
      properties:
        id:
          type: integer
        tipo:
          type: string
          enum:
          - CONFIRMACAO_48H
          - LEMBRETE_24H
          - CANCELAMENTO
          - REMARCACAO
        canal:
          type: string
          enum:
          - WHATSAPP
          - SMS
        agendadaPara:
          type: string
          format: date-time
        enviadaEm:
          type: string
          format: date-time
          nullable: true
        statusEntrega:
          type: string
          enum:
          - PENDENTE
          - ENVIADA
          - ENTREGUE
          - LIDA
          - FALHA
          - CANCELADA
          description: 'CANCELADA: o envio deixou de valer, por exemplo porque a consulta foi cancelada ou remarcada.'
        confirmacao:
          type: boolean
          nullable: true
          description: Verdadeiro quando o paciente respondeu que confirma.
        respostaTexto:
          type: string
          nullable: true
          description: Resposta do paciente. Para perfis sem liberação do campo, omitido.
        respondidaEm:
          type: string
          format: date-time
          nullable: true
        erro:
          type: string
          nullable: true
    ReenvioEntrada:
      type: object
      required:
      - tipo
      properties:
        tipo:
          type: string
          enum:
          - CONFIRMACAO_48H
          - LEMBRETE_24H
        canal:
          type: string
          enum:
          - WHATSAPP
          - SMS
          nullable: true
          description: 'Vazio: WhatsApp, com SMS se falhar.'
    ParametrosNotificacao:
      type: object
      required:
      - confirmacaoAntecedenciaHoras
      - lembreteAntecedenciaHoras
      - alertaSemRespostaAntecedenciaHoras
      properties:
        confirmacaoAntecedenciaHoras:
          type: integer
          minimum: 2
          maximum: 168
          description: Pedido de confirmação, em horas antes da consulta. Hoje 48 (RN07).
        lembreteAntecedenciaHoras:
          type: integer
          minimum: 1
          maximum: 167
          description: Lembrete, em horas antes. Hoje 24. Deve ser menor que a confirmação. No mesmo momento, a recepção é avisada de quem não
            respondeu à confirmação.
        alertaSemRespostaAntecedenciaHoras:
          type: integer
          minimum: 1
          maximum: 166
          description: Aviso final à recepção de quem continua sem retorno, em horas antes. Hoje 12. Deve ser menor que o lembrete.
    EventoStatusEntrega:
      type: object
      description: Contrato canônico do sistema. O adaptador do provedor escolhido (P18) converte o formato dele para este.
      required:
      - eventoId
      - mensagemId
      - status
      - ocorridoEm
      properties:
        eventoId:
          type: string
          maxLength: 100
          description: Identificador único do evento no provedor. Evento repetido é ignorado (idempotência).
        mensagemId:
          type: string
          maxLength: 100
          description: Identificador da mensagem no provedor, guardado no envio.
        status:
          type: string
          enum:
          - ENVIADA
          - ENTREGUE
          - LIDA
          - FALHA
        ocorridoEm:
          type: string
          format: date-time
        erro:
          type: string
          maxLength: 500
          nullable: true
    EventoResposta:
      type: object
      required:
      - eventoId
      - telefone
      - texto
      - recebidoEm
      - canal
      properties:
        eventoId:
          type: string
          maxLength: 100
        mensagemId:
          type: string
          maxLength: 100
          nullable: true
          description: Mensagem respondida, quando o provedor informa. Sem ela, a resposta é ligada à última mensagem pendente do telefone.
        telefone:
          type: string
          maxLength: 20
          description: Telefone de quem respondeu, só dígitos, com DDI.
        texto:
          type: string
          maxLength: 1000
        recebidoEm:
          type: string
          format: date-time
        canal:
          type: string
          enum:
          - WHATSAPP
          - SMS
    WebhookAck:
      type: object
      required:
      - recebido
      - efeito
      properties:
        recebido:
          type: boolean
        efeito:
          type: string
          enum:
          - PROCESSADO
          - IGNORADO_REPETIDO
          - IGNORADO_SEM_CORRESPONDENCIA
          description: O que o servidor fez com o evento. Sempre 200 quando a assinatura é válida, para o provedor não reenviar sem necessidade.
    FiltrosAplicados:
      type: object
      description: Filtros usados, devolvidos junto do resultado (RF22).
      required:
